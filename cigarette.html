<title>담배 한 대</title>
<style>
  :root { --ink:#8b93a6; --ink-dim:#4b5266; --ember:#ff7a2c; }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%; overflow:hidden; background:#05070d; color:var(--ink);
    font-family: Georgia, "Times New Roman", serif; -webkit-font-smoothing:antialiased;
    touch-action:none; cursor:pointer;
  }
  #stage { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  .hud { position:fixed; inset:0; pointer-events:none; z-index:2; }

  .hint {
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center;
    font-size:clamp(12px,1.7vw,18px); letter-spacing:0.28em; text-transform:uppercase;
    color:#dbe0e8; opacity:0.9; transition:opacity 1.2s ease; padding:0 28px; line-height:2;
    text-shadow:0 2px 16px rgba(0,0,0,0.95);
  }
  .hint.gone { opacity:0; }
  .hint b { font-weight:normal; color:#fff; }

  .count {
    position:absolute; top:clamp(18px,4vh,38px); right:clamp(18px,4vw,42px);
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:12px;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-dim); text-align:right; line-height:1.7;
    text-shadow:0 1px 8px rgba(0,0,0,0.8);
  }
  .count .n { color:#c3cad8; font-size:15px; }

  .picker { position:absolute; top:clamp(18px,4vh,38px); left:clamp(18px,4vw,42px); pointer-events:auto; }
  .pick-btn {
    cursor:pointer; background:rgba(10,14,22,0.5); border:1px solid #2a3040; color:#c3cad8;
    font-family:Georgia,serif; font-size:13px; letter-spacing:0.14em; padding:9px 15px;
    transition:border-color .2s, color .2s; backdrop-filter:blur(3px);
  }
  .pick-btn:hover { border-color:var(--ember); color:#ffd9b0; }
  .pick-btn:focus-visible { outline:2px solid var(--ember); outline-offset:2px; }
  .menu {
    margin-top:6px; display:flex; flex-direction:column; min-width:150px;
    border:1px solid #2a3040; background:rgba(8,11,18,0.94); backdrop-filter:blur(4px);
  }
  .menu[hidden] { display:none; }
  .menu button {
    cursor:pointer; background:transparent; border:none; color:#98a0b2; text-align:left;
    font-family:Georgia,serif; font-size:13px; letter-spacing:0.12em; padding:11px 15px;
    border-bottom:1px solid rgba(42,48,64,0.5); transition:background .15s, color .15s;
  }
  .menu button:last-child { border-bottom:none; }
  .menu button:hover { background:rgba(255,122,44,0.12); color:#ffd9b0; }
  .menu button.active { color:#ffd9b0; }
  .menu button:focus-visible { outline:1px solid var(--ember); outline-offset:-1px; }

  .weather {
    position:absolute; bottom:clamp(18px,4vh,38px); right:clamp(18px,4vw,42px);
    display:flex; gap:6px; pointer-events:auto;
  }
  .wbtn {
    cursor:pointer; background:rgba(10,14,22,0.5); border:1px solid #2a3040; color:#98a0b2;
    font-family:Georgia,serif; font-size:13px; letter-spacing:0.1em; padding:8px 15px;
    backdrop-filter:blur(3px); transition:border-color .2s, color .2s;
  }
  .wbtn:hover { color:#c3cad8; }
  .wbtn.active { border-color:var(--ember); color:#ffd9b0; }
  .wbtn:focus-visible { outline:2px solid var(--ember); outline-offset:2px; }

  .mute {
    position:absolute; bottom:clamp(18px,4vh,38px); left:clamp(18px,4vw,42px); pointer-events:auto;
    cursor:pointer; background:transparent; border:none;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-dim); padding:6px 4px; transition:color .25s ease;
    text-shadow:0 1px 8px rgba(0,0,0,0.8);
  }
  .mute:hover { color:#c3cad8; }
  .mute.off { color:#2a3040; }
  .mute:focus-visible { outline:1px solid var(--ember); outline-offset:3px; }

  @media (prefers-reduced-motion: reduce) { .hint { transition:none; } }
</style>

<canvas id="stage"></canvas>
<div class="hud">
  <div class="picker" id="picker">
    <button class="pick-btn" id="pickBtn" aria-haspopup="true" aria-expanded="false">담배 선택 · 에쉐</button>
    <div class="menu" id="menu" hidden>
      <button data-t="esse" class="active">에쉐</button>
      <button data-t="masse">마쉐</button>
      <button data-t="marlboro">말볼오</button>
      <button data-t="cigar">시가</button>
    </div>
  </div>
  <div class="weather" id="weather">
    <button data-w="night" class="wbtn active">밤</button>
    <button data-w="day" class="wbtn">낮</button>
    <button data-w="rain" class="wbtn">비</button>
    <button data-w="snow" class="wbtn">눈</button>
  </div>
  <div class="count"><span class="n" id="puffs">0</span><br>모금</div>
  <div class="hint" id="hint"><b>아래로 긁어</b> 담뱃불 붙이기</div>
  <button class="mute" id="mute" aria-label="소리 켜고 끄기">소리 켜짐</button>
</div>

      const rateAmb = reduced?14:44;
      ambientAcc += dt*rateAmb*(cig.drawing?0.4:1);
      const sway = Math.sin(t*1.7)*cig.hwNear*0.6 + Math.sin(t*3.3)*cig.hwNear*0.25;
      while (ambientAcc>=1){ ambientAcc-=1;
        addSmoke(e.x+sway+(Math.random()-0.5)*2, e.y, { vy0:-72, jit:1.5, r0:2, maxR:15, life:6, alpha:0.05, buoy:20, turb:1, bright:1, rise:0.7 });
      }
      if (cig.drawing && !reduced && Math.random()<dt*34) addSpark(e.x,e.y);
    }
    audioState.lit=cig.lit&&!cig.done; audioState.draw=cig.drawing;

    for (let i=smoke.length-1;i>=0;i--){
      const p=smoke[i]; p.age+=dt;
      if (p.age>=p.life){ smoke.splice(i,1); continue; }
      const k=reduced?0.4:1;
      const ageK=Math.min(1,p.age/p.rise);        // 상승 후 난류 개입(아래는 곧게, 위는 소용돌이)
      const c=curl(p.x,p.y,t);
      p.vy -= p.buoy*dt;
      p.vx += c.x*(3+52*ageK)*p.turb*dt*k;
      p.vy += c.y*(2+26*ageK)*p.turb*dt*k;
      p.vx*=0.985; p.vy*=0.99;
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.r += (p.maxR-p.r)*dt*0.5;
    }
    haze = Math.max(0, haze - dt*0.3);
    for (let i=sparks.length-1;i>=0;i--){
      const s=sparks[i]; s.age+=dt;
      if (s.age>=s.life){ sparks.splice(i,1); continue; }
      s.vy+=30*dt; s.vx*=0.98; s.x+=s.vx*dt; s.y+=s.vy*dt;
    }
    for (let i=ashBits.length-1;i>=0;i--){
      const b=ashBits[i]; b.age+=dt; b.vy+=46*dt; b.vx*=0.985; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vr*dt;
      const overTray = Math.abs(b.x-tray.cx)<tray.rimRx*0.95;
      if (b.vy>0 && b.y>=tray.cy && overTray){ settle(b); ashBits.splice(i,1); }   // 재떨이 위면 쌓임
      else if (b.age>=b.life){ ashBits.splice(i,1); }                              // 아니면 공중에서 사그라듦
    }
    // 비: 빗방울 낙하(대각선)
    if(weather==="rain"){ for(const d of rain){ d.y += d.sp*dt; d.x += d.sp*dt*0.26;
      if(d.y>H+d.len){ d.y=-d.len-Math.random()*40; d.x=Math.random()*W*1.2-W*0.1; }
      if(d.x>W+30) d.x-=W*1.25; } }
    // 눈: 천천히 흔들리며 낙하
    if(weather==="snow"){ for(const f of snow){ f.y += f.sp*dt; f.x += Math.sin((sceneT+f.ph)*f.fr)*f.sway*dt + f.wind*dt;
      if(f.y>H+f.r){ f.y=-f.r; f.x=Math.random()*W; }
      if(f.x>W+12) f.x-=W+24; else if(f.x<-12) f.x+=W+24; } }
  }

  // --- 렌더 -------------------------------------------------------
  // 사진 속 저해상도 달 위에 사실적인 달을 그려 덮음(부드러운 마리아·미세 텍스처)
  function buildMoonCache(){
    const r=bg.moonR; if(r<=0) return; moonCacheR=r;
    const SS=2, R=r*SS, P=Math.max(2,Math.ceil(2*R));
    moonCanvas.width=P; moonCanvas.height=P;
    const c=moonCanvas.getContext("2d"); const mx=R,my=R;
    c.clearRect(0,0,P,P); c.save(); c.beginPath(); c.arc(mx,my,R,0,7); c.clip();
    const md=c.createRadialGradient(mx-R*0.2,my-R*0.22,R*0.15,mx,my,R*1.1);
    md.addColorStop(0,"#f6f4ec"); md.addColorStop(0.7,"#e8e4d8"); md.addColorStop(1,"#d0ccbf");
    c.fillStyle=md; c.fillRect(0,0,P,P);
    const mare=(dx,dy,rr,al)=>{ const g=c.createRadialGradient(mx+dx*R,my+dy*R,0,mx+dx*R,my+dy*R,rr*R);
      g.addColorStop(0,`rgba(118,116,108,${al})`); g.addColorStop(0.65,`rgba(128,126,118,${al*0.45})`); g.addColorStop(1,"rgba(140,138,130,0)");
      c.fillStyle=g; c.fillRect(0,0,P,P); };
    mare(-0.16,-0.26,0.52,0.17); mare(0.20,-0.06,0.40,0.14); mare(0.06,0.30,0.46,0.15); mare(-0.36,0.12,0.30,0.11); mare(0.36,0.30,0.28,0.10);
    for(let i=0;i<58;i++){ const ang=i*2.399, rad=Math.sqrt(((i*41)%100)/100)*R*0.95, cx2=mx+Math.cos(ang)*rad, cy2=my+Math.sin(ang)*rad, s=R*(0.008+((i*53)%50)/50*0.03), a=0.05+((i*29)%40)/40*0.08;
      c.fillStyle=`rgba(115,112,104,${a})`; c.beginPath(); c.arc(cx2,cy2,s,0,7); c.fill();
      c.fillStyle=`rgba(252,250,242,${a*0.4})`; c.beginPath(); c.arc(cx2-s*0.3,cy2-s*0.3,s*0.6,0,7); c.fill(); }
    const limb=c.createRadialGradient(mx,my,R*0.68,mx,my,R); limb.addColorStop(0,"rgba(0,0,0,0)"); limb.addColorStop(1,"rgba(58,55,49,0.34)");
    c.fillStyle=limb; c.fillRect(0,0,P,P); c.restore();
  }
  function drawMoon(){
    const mx=bg.moonX, my=bg.moonY, r=bg.moonR;
    if (moonCacheR!==r) buildMoonCache();
    const halo=ctx.createRadialGradient(mx,my,r*0.6,mx,my,r*2.8);
    halo.addColorStop(0,"rgba(230,232,240,0.12)"); halo.addColorStop(0.5,"rgba(208,214,228,0.035)"); halo.addColorStop(1,"rgba(208,214,228,0)");
    ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(mx,my,r*2.8,0,7); ctx.fill();
    ctx.drawImage(moonCanvas, mx-r, my-r, r*2, r*2);
  }

  // 구름 2겹(패럴랙스) — 날씨별 색은 cloudDraw(tint)로
  function drawClouds(baseAlpha){
    if(!cloudReady) return;
    let DW=W*1.9, off=(sceneT*4.5)%DW;
    ctx.save(); ctx.globalAlpha=0.65*baseAlpha;
    for(let xo=-off; xo<W; xo+=DW) ctx.drawImage(cloudDraw, xo, -H*0.10, DW, H*1.05);
    ctx.restore();
    DW=W*1.12; off=(sceneT*11)%DW;
    ctx.save(); ctx.globalAlpha=Math.min(1,baseAlpha);
    for(let xo=-off; xo<W; xo+=DW) ctx.drawImage(cloudDraw, xo, H*0.02, DW, H*0.95);
    ctx.restore();
  }

  function drawNightSky(){
    const sg=ctx.createLinearGradient(0,0,0,H);
    sg.addColorStop(0,"#060a14"); sg.addColorStop(0.42,"#0a1120"); sg.addColorStop(0.72,"#0a1220"); sg.addColorStop(1,"#05070e");
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
    const mw=ctx.createRadialGradient(bg.moonX,bg.moonY,10,bg.moonX,bg.moonY,Math.max(W,H)*0.62);
    mw.addColorStop(0,"rgba(58,64,84,0.22)"); mw.addColorStop(0.5,"rgba(30,36,54,0.09)"); mw.addColorStop(1,"rgba(20,24,40,0)");
    ctx.fillStyle=mw; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.globalCompositeOperation="lighter";
    for(const s of stars){ const tw=s.b*(0.65+0.35*Math.sin(sceneT*s.tw+s.ph)); ctx.fillStyle=`rgba(232,238,247,${tw})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); }
    ctx.restore();
    drawMoon();
    drawClouds(1.0);
    const mb=ctx.createRadialGradient(bg.moonX,bg.moonY,bg.moonR*0.85,bg.moonX,bg.moonY,bg.moonR*2.5);
    mb.addColorStop(0,"rgba(238,238,242,0.16)"); mb.addColorStop(0.4,"rgba(222,226,236,0.09)"); mb.addColorStop(1,"rgba(210,216,230,0)");
    ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=mb; ctx.beginPath(); ctx.arc(bg.moonX,bg.moonY,bg.moonR*2.5,0,7); ctx.fill(); ctx.restore();
    const ml=ctx.createRadialGradient(bg.moonX,bg.moonY,bg.moonR*0.5,bg.moonX,bg.moonY,bg.moonR*6);
    ml.addColorStop(0,"rgba(220,222,230,0.08)"); ml.addColorStop(0.5,"rgba(200,206,222,0.03)"); ml.addColorStop(1,"rgba(200,206,222,0)");
    ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=ml; ctx.fillRect(0,0,W,H); ctx.restore();
  }

  function drawSun(){
    // 따뜻한 여름 햇살(부드럽게, 눈부시지 않게)
    const mx=bg.moonX,my=bg.moonY,r=bg.moonR;
    const glow=ctx.createRadialGradient(mx,my,r*0.4,mx,my,r*5);
    glow.addColorStop(0,"rgba(255,246,214,0.34)"); glow.addColorStop(0.38,"rgba(255,238,196,0.13)"); glow.addColorStop(1,"rgba(255,238,196,0)");
    ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);
    const d=ctx.createRadialGradient(mx,my,r*0.15,mx,my,r);
    d.addColorStop(0,"rgba(255,251,232,0.8)"); d.addColorStop(0.6,"rgba(255,244,214,0.38)"); d.addColorStop(1,"rgba(255,240,205,0)");
    ctx.fillStyle=d; ctx.beginPath(); ctx.arc(mx,my,r,0,7); ctx.fill();
    ctx.restore();
  }

  function drawDaySky(){
    // 싱그러운 여름날 — 선명한 하늘색 + 연둣빛 지평선
    const sg=ctx.createLinearGradient(0,0,0,H);
    sg.addColorStop(0,"#3f88c9"); sg.addColorStop(0.4,"#5ea2d6"); sg.addColorStop(0.72,"#a4d2e7"); sg.addColorStop(1,"#dcefdd");
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
    // 태양측 따뜻한 대기광
    const warm=ctx.createRadialGradient(bg.moonX,bg.moonY,bg.moonR*0.5,bg.moonX,bg.moonY,Math.max(W,H)*0.6);
    warm.addColorStop(0,"rgba(255,246,214,0.16)"); warm.addColorStop(0.5,"rgba(255,240,200,0.05)"); warm.addColorStop(1,"rgba(255,240,200,0)");
    ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=warm; ctx.fillRect(0,0,W,H); ctx.restore();
    drawSun();
    drawClouds(1.05);   // 여름 뭉게구름 적당히
    // 지평선 싱그러운 연둣빛 하늘거림
    const hz=ctx.createLinearGradient(0,H*0.5,0,H); hz.addColorStop(0,"rgba(206,236,214,0)"); hz.addColorStop(1,"rgba(212,238,218,0.16)");
    ctx.fillStyle=hz; ctx.fillRect(0,H*0.5,W,H*0.5);
  }

  function drawRainSky(){
    const sg=ctx.createLinearGradient(0,0,0,H);
    sg.addColorStop(0,"#2b323b"); sg.addColorStop(0.5,"#39424d"); sg.addColorStop(1,"#242a30");
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
    const lp=ctx.createRadialGradient(bg.moonX,bg.moonY,10,bg.moonX,bg.moonY,bg.moonR*5);
    lp.addColorStop(0,"rgba(188,196,208,0.14)"); lp.addColorStop(1,"rgba(188,196,208,0)");
    ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=lp; ctx.fillRect(0,0,W,H); ctx.restore();
    drawClouds(1.45);
    const ov=ctx.createLinearGradient(0,0,0,H); ov.addColorStop(0,"rgba(18,22,27,0.4)"); ov.addColorStop(1,"rgba(14,17,21,0.18)");
    ctx.fillStyle=ov; ctx.fillRect(0,0,W,H);
  }

  function drawSnowSky(){
    // 흐린 겨울 하늘(비보다 밝은 회청색)
    const sg=ctx.createLinearGradient(0,0,0,H);
    sg.addColorStop(0,"#3a4550"); sg.addColorStop(0.5,"#4d5863"); sg.addColorStop(1,"#5c6672");
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
    const lp=ctx.createRadialGradient(bg.moonX,bg.moonY,10,bg.moonX,bg.moonY,bg.moonR*6);
    lp.addColorStop(0,"rgba(214,222,232,0.16)"); lp.addColorStop(1,"rgba(214,222,232,0)");
    ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle=lp; ctx.fillRect(0,0,W,H); ctx.restore();
    drawClouds(1.35);
    const ov=ctx.createLinearGradient(0,0,0,H); ov.addColorStop(0,"rgba(30,36,44,0.20)"); ov.addColorStop(1,"rgba(24,30,38,0.08)");
    ctx.fillStyle=ov; ctx.fillRect(0,0,W,H);
  }

  function drawBg(){
    if(weather==="day") drawDaySky();
    else if(weather==="rain") drawRainSky();
    else if(weather==="snow") drawSnowSky();
    else drawNightSky();
    // 필름 그레인(공통)
    if(grainReady){ ctx.save(); ctx.globalAlpha=0.05; ctx.globalCompositeOperation="overlay";
      const ox=grainOff.x|0, oy=grainOff.y|0;
      for(let y=-oy;y<H;y+=256) for(let x=-ox;x<W;x+=256) ctx.drawImage(grain,x,y);
      ctx.restore(); }
    // 전경 어둡게(날씨별)
    const fg=ctx.createLinearGradient(0,H*0.55,0,H);
    if(weather==="day"){ fg.addColorStop(0,"rgba(34,44,42,0)"); fg.addColorStop(1,"rgba(26,36,34,0.72)"); }
    else if(weather==="rain"){ fg.addColorStop(0,"rgba(8,10,14,0)"); fg.addColorStop(1,"rgba(6,8,11,0.9)"); }
    else if(weather==="snow"){ fg.addColorStop(0,"rgba(14,18,24,0)"); fg.addColorStop(1,"rgba(10,14,20,0.88)"); }
    else { fg.addColorStop(0,"rgba(3,4,9,0)"); fg.addColorStop(1,"rgba(2,3,7,0.92)"); }
    ctx.fillStyle=fg; ctx.fillRect(0,H*0.55,W,H*0.45);
  }

  // 빗줄기(맨 앞 레이어)
  function drawRain(){
    if(weather!=="rain" || !rain.length) return;
    ctx.save(); ctx.strokeStyle="rgba(182,198,218,0.26)"; ctx.lineWidth=1.1; ctx.lineCap="round"; ctx.beginPath();
    for(const d of rain){ ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-d.len*0.26, d.y-d.len); }
    ctx.stroke(); ctx.restore();
  }
  // 눈송이(맨 앞 레이어)
  function drawSnow(){
    if(weather!=="snow" || !snow.length) return;
    ctx.save();
    for(const f of snow){ ctx.globalAlpha=f.a; ctx.fillStyle="#eef3f8"; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); }
    ctx.restore();
  }

  function drawAshtray(){
    const {cx,cy,rimRx,rimRy,innerRx,innerRy,wallH}=tray;
    ctx.beginPath(); ctx.moveTo(cx-rimRx,cy);
    ctx.quadraticCurveTo(cx-rimRx,cy+wallH,cx,cy+wallH);
    ctx.quadraticCurveTo(cx+rimRx,cy+wallH,cx+rimRx,cy);
    ctx.quadraticCurveTo(cx,cy+rimRy,cx-rimRx,cy); ctx.closePath();
    const wall=ctx.createLinearGradient(0,cy,0,cy+wallH); wall.addColorStop(0,"#1a1e26"); wall.addColorStop(1,"#080a0e");
    ctx.fillStyle=wall; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx,cy,rimRx,rimRy,0,0,7); ctx.fillStyle="#20242c"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx,cy+rimRy*0.12,innerRx,innerRy,0,0,7);
    const well=ctx.createRadialGradient(cx,cy,2,cx,cy,innerRx); well.addColorStop(0,"#040507"); well.addColorStop(1,"#12151b");
    ctx.fillStyle=well; ctx.fill();
    for (const s of pile){ ctx.fillStyle=`rgba(150,148,140,${s.sh})`; ctx.beginPath(); ctx.ellipse(s.x,s.y,s.r,s.r*0.6,0,0,7); ctx.fill(); }
    for (const sgn of [-1,1]){ ctx.fillStyle="rgba(4,5,7,0.85)"; ctx.beginPath(); ctx.ellipse(cx+sgn*rimRx*0.62,cy-rimRy*0.15,rimRx*0.1,rimRy*0.3,0,0,7); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(cx,cy,rimRx,rimRy,0,Math.PI*1.08,Math.PI*1.75); ctx.strokeStyle="rgba(120,130,148,0.28)"; ctx.lineWidth=1.2; ctx.stroke();
  }

  function tapered(d0,d1,c0,c1,c2){
    const h0=hwAt(d0), h1=hwAt(d1), y0=-d0, y1=-d1, hm=Math.max(h0,h1);
    ctx.beginPath(); ctx.moveTo(-h0,y0); ctx.lineTo(-h1,y1); ctx.lineTo(h1,y1); ctx.lineTo(h0,y0); ctx.closePath();
    const g=ctx.createLinearGradient(-hm,0,hm,0);
    g.addColorStop(0,c0); g.addColorStop(0.42,c1); g.addColorStop(0.5,c2); g.addColorStop(0.62,c1); g.addColorStop(1,c0);
    ctx.fillStyle=g; ctx.fill();
  }

  function ringLines(dList,color,lw){
    ctx.strokeStyle=color; ctx.lineWidth=lw;
    for (const dd of dList){ ctx.beginPath(); ctx.moveTo(-hwAt(dd),-dd); ctx.lineTo(hwAt(dd),-dd); ctx.stroke(); }
  }

  function drawCigBody(){
    const T=TYPES[cig.type];
    const dF=cig.filterLen, dB=cig.dBurn, dT=cig.done?cig.dBurn:cig.dTop;
    const hwF=hwAt(dF);

    if (T.wrap==="cigar"){
      // 캐러멜 잎 래퍼
      tapered(0,dB,"#6b4022","#a9743e","#c2894f");
      ctx.save(); ctx.beginPath(); ctx.rect(-cig.hwNear,-dB,cig.hwNear*2,dB); ctx.clip();
      ctx.strokeStyle="rgba(70,42,20,0.28)"; ctx.lineWidth=1;
      for (let d=6; d<dB; d+=Math.max(11,cig.hwNear)){ ctx.beginPath(); ctx.moveTo(-hwAt(d),-d); ctx.lineTo(hwAt(d)*0.5,-d-cig.hwNear*1.6); ctx.stroke(); }
      ctx.restore();
      // 흰 인쇄 밴드 + 금선 + 엠블럼
      const b0=dF*0.55, b1=b0+cig.L*0.06, bm=(b0+b1)/2;
      tapered(b0,b1,"#cdbfa4","#efe7d6","#fbf6ec");
      ringLines([b0+2,b1-2],"rgba(150,110,40,0.75)",1.4);
      ctx.fillStyle="rgba(150,110,40,0.6)"; ctx.beginPath(); ctx.arc(0,-bm,hwAt(bm)*0.28,0,7); ctx.fill();
    } else {
      // 필터
      if (T.filter==="cork"){
        tapered(0,dF,"#9a6f30","#c99a4e","#e0b566");
        ctx.save(); ctx.beginPath(); ctx.rect(-cig.hwNear,-dF,cig.hwNear*2,dF); ctx.clip();
        ctx.fillStyle="rgba(90,58,20,0.4)";
        for (let i=0;i<24;i++){ const sx=-cig.hwNear+Math.abs(Math.sin(i*12.9))*cig.hwNear*2, sy=-Math.abs(Math.sin(i*7.7))*dF; ctx.beginPath(); ctx.arc(sx,sy,0.8,0,7); ctx.fill(); }
        ctx.restore();
      } else {
        // 흰색 필터(에쉐·마쉐 계열)
        tapered(0,dF,"#d7d8db","#eef0f2","#ffffff");
      }
      // 종이(밴드보다 먼저)
      tapered(dF,dB,"#cdc8bd","#f1eee6","#fdfbf6");
      // 밴드/씰(종이 위에)
      if (T.band==="gold"){
        tapered(dF,dF+cig.L*0.032,"#8a6a18","#d6b048","#f2d670");
        ringLines([dF+1.5,dF+cig.L*0.032-1.5],"rgba(110,84,20,0.75)",1.2);
      } else if (T.band==="silver"){
        tapered(dF-cig.L*0.006,dF+cig.L*0.006,"#7d838c","#c4c9d0","#eef1f4");
        if (T.logo){ ctx.fillStyle=T.logo; const ly=dF*0.62; ctx.beginPath(); ctx.arc(0,-ly,Math.max(1.4,hwF*0.22),0,7); ctx.fill(); ctx.fillRect(-hwF*0.55,-ly-0.7,hwF*1.1,1.4); }
      } else {
        ringLines([dF],"rgba(176,176,182,0.7)",1);
      }
    }

    drawEmber(dB,dT);
  }

  // 사실적인 재 기둥 + 연소선(불씨 링) + 살아있는 불씨
  function drawEmber(dB,dT){
    const hwB=hwAt(dB), hwR=hwAt(dT);
    if (!cig.lit && cig.heat<0.02){
      // 불 안 붙은 담뱃잎 끝(갈색 절단면)
      ctx.fillStyle="#5e4d31"; ctx.beginPath(); ctx.ellipse(0,-dT,hwR,hwR*0.5,0,0,7); ctx.fill();

    const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=0.9;
    bp.frequency.setValueAtTime(260,now); bp.frequency.linearRampToValueAtTime(820,now+dur*0.5); bp.frequency.linearRampToValueAtTime(230,now+dur);
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(0.11,now+dur*0.5); g.gain.exponentialRampToValueAtTime(0.0007,now+dur);
    if(AC.createStereoPanner){ const pan=AC.createStereoPanner(); pan.pan.setValueAtTime(-0.85,now); pan.pan.linearRampToValueAtTime(0.85,now+dur); src.connect(bp); bp.connect(g); g.connect(pan); pan.connect(master); }
    else { src.connect(bp); bp.connect(g); g.connect(master); }
    src.start(now); src.stop(now+dur+0.1);
  }
  function honk(){ // 가벼운 경적
    if(!audioReady||muted) return; const now=AC.currentTime;
    const g=AC.createGain(); g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(0.08,now+0.03); g.gain.setValueAtTime(0.08,now+0.16); g.gain.exponentialRampToValueAtTime(0.0006,now+0.3); g.connect(master);
    for(const fr of [370,466]){ const o=AC.createOscillator(); o.type="sawtooth"; o.frequency.value=fr; const og=AC.createGain(); og.gain.value=0.5; o.connect(og); og.connect(g); o.start(now); o.stop(now+0.32); }
  }
  function crunch(){ // 눈 밟는 뽀득
    if(!audioReady||muted) return; const now=AC.currentTime; const sub=2+Math.floor(Math.random()*2); let t=now;
    for(let i=0;i<sub;i++){ const src=AC.createBufferSource(); src.buffer=noiseBuf; src.playbackRate.value=0.85+Math.random()*0.5;
      const hp=AC.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1700+Math.random()*1400;
      const g=AC.createGain(); const peak=0.10+Math.random()*0.06;
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+0.006); g.gain.exponentialRampToValueAtTime(0.0005,t+0.045+Math.random()*0.04);
      src.connect(hp); hp.connect(g); g.connect(master); src.start(t); src.stop(t+0.14); t+=0.028+Math.random()*0.05; }
  }
  let acCricket=0, acCar=0, acHonk=0, acStep=0, acShout=0, acWhistle=0;
  function updateAmbient(dt){
    if(!audioReady||muted) return;
    if(weather==="night"){ acCricket-=dt; if(acCricket<=0){ chirp(); if(Math.random()<0.5) chirp(); acCricket=0.3+Math.random()*0.8; } }
    else if(weather==="day"){
      acCar-=dt; if(acCar<=0){ carPass(); acCar=3.5+Math.random()*5; }
      acHonk-=dt; if(acHonk<=0){ honk(); acHonk=(Math.random()<0.25)?0.35:10+Math.random()*14; }
      acShout-=dt; if(acShout<=0){ kidShout(); if(Math.random()<0.3) kidShout(); acShout=1.2+Math.random()*2.6; }   // 운동장 고함
      acWhistle-=dt; if(acWhistle<=0){ whistle(); acWhistle=12+Math.random()*22; }                                  // 호루라기
    }
    else if(weather==="snow"){ acStep-=dt; if(acStep<=0){ crunch(); acStep=0.5+Math.random()*0.45; } }
  }
  function updateAudio(dt){
    if (!audioReady) return;
    if (AC.state!=="running"){ try{ AC.resume(); }catch(e){} }
    const tg=audioState.draw?0.14:(audioState.lit?0.02:0);
    drawGain.gain.setTargetAtTime(tg,AC.currentTime,0.08);
    if (!muted && audioState.lit){ const rate=audioState.draw?14:5; if (Math.random()<dt*rate) crackle(); }
    updateAmbient(dt);
  }

  // --- 루프 -------------------------------------------------------
  let last=0;
  function frame(now){
    if (!last) last=now; let dt=(now-last)/1000; last=now; if (dt>0.05) dt=0.05;
    const t=now/1000;
    update(dt,t); updateAudio(dt);
    drawBg(); drawAshtray(); drawButts(); drawAshBits(); drawCigScene(); drawSparks(); drawSmoke(); drawRain(); drawSnow();
    requestAnimationFrame(frame);
  }

  // --- 입력 -------------------------------------------------------
  const hint=document.getElementById("hint"), puffsEl=document.getElementById("puffs");
  const muteBtn=document.getElementById("mute"), pickBtn=document.getElementById("pickBtn"), menu=document.getElementById("menu");
  let hinted=false, puffs=0, lastTapT=0;
  const LIGHT_HINT="<b>아래로 긁어</b> 담뱃불 붙이기";

  function closeMenu(){ menu.hidden=true; pickBtn.setAttribute("aria-expanded","false"); }
  let scratching=false, scrLastY=0, scrStartY=0, scrAcc=0;
  const ptrY=(e)=>{ const t=e.touches&&e.touches[0]; return t?t.clientY:e.clientY; };

  function ignite(){
    scratching=false;
    cig.lit=true; cig.heat=1; flare=1; gasIgnite();
    hint.innerHTML="<b>꾹</b> 눌러 빨고 <b>·</b> 떼면 연기 <b>·</b> 우클릭/더블탭 재털기";
    hinted=false;
    setTimeout(()=>{ hint.classList.add("gone"); hinted=true; }, 2800);
  }
  function onDown(e){
    initAudio(); resumeAudio(); closeMenu();
    if (cig.done || tossT>=0) return;
    if (cig.lit){ if(!hinted){ hint.classList.add("gone"); hinted=true; } cig.drawing=true; cig.holdMs=0; }
    else { scratching=true; scrStartY=scrLastY=ptrY(e); scrAcc=0; }
  }
  function onMove(e){
    if (!scratching) return;
    const y=ptrY(e), dy=y-scrLastY; scrLastY=y;
    if (dy>1.5){ scrAcc+=dy; while(scrAcc>26){ scrAcc-=26; flintTick(); const em=emberWorld(); addSpark(em.x,em.y); } }
    if (!cig.lit && (y-scrStartY)>85) ignite();
  }
  function release(){
    if (!cig.drawing) return; cig.drawing=false;
    if (cig.holdMs>170){ exhale(cig.holdMs/14); exhaleSound(cig.holdMs); puffs+=1; puffsEl.textContent=puffs; }
  }
  function onUp(){ if (scratching){ scratching=false; } else release(); }

  canvas.addEventListener("mousedown",(e)=>{ if (e.button===0){ e.preventDefault(); onDown(e); } });
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart",(e)=>{ e.preventDefault(); onDown(e); },{passive:false});
  canvas.addEventListener("touchmove",(e)=>{ e.preventDefault(); onMove(e); },{passive:false});
  canvas.addEventListener("touchend",(e)=>{ e.preventDefault();   // canvas에만 → HUD 버튼 탭 안 잡아먹음
    const held=cig.holdMs, wasScratch=scratching;
    onUp();
    // 불 붙은 상태에서 짧은 탭 2번(더블 탭) = 재 털기
    if (cig.lit && !wasScratch && held<260){ const now=(performance&&performance.now?performance.now():Date.now());
      if (now-lastTapT<330){ initAudio(); resumeAudio(); tap(); lastTapT=0; } else lastTapT=now; }
    else lastTapT=0;
  },{passive:false});
  canvas.addEventListener("touchcancel",()=>{ scratching=false; release(); });
  window.addEventListener("blur",()=>{ scratching=false; release(); });
  canvas.addEventListener("contextmenu",(e)=>{ e.preventDefault(); if(!cig.lit) return; initAudio(); resumeAudio(); tap(); });

  function setType(t){
    cig.type=t; cig.dBurn=null; cig.done=false; cig.heat=0; cig.drawing=false; layout();  // 새 담배는 불 안 붙음
    hint.innerHTML=LIGHT_HINT; hint.classList.remove("gone"); hinted=false;
    pickBtn.textContent="담배 선택 · "+TYPES[t].label;
    menu.querySelectorAll("button").forEach((b)=>b.classList.toggle("active",b.dataset.t===t));
  }
  const weatherEl=document.getElementById("weather");
  function setWeather(w){
    weather=w;
    if(w==="day") tintClouds(248,250,252);
    else if(w==="rain") tintClouds(96,104,112);
    else if(w==="snow") tintClouds(198,206,216);
    else tintClouds(168,178,200);
    applyAmbientGains();
    weatherEl.querySelectorAll(".wbtn").forEach((b)=>b.classList.toggle("active",b.dataset.w===w));
  }
  weatherEl.addEventListener("click",(e)=>{ const b=e.target.closest(".wbtn"); if(!b) return; e.stopPropagation(); initAudio(); resumeAudio(); setWeather(b.dataset.w); });

  pickBtn.addEventListener("click",(e)=>{ e.stopPropagation(); initAudio(); resumeAudio(); const open=menu.hidden; menu.hidden=!open; pickBtn.setAttribute("aria-expanded",String(open)); });
  menu.addEventListener("click",(e)=>{ const b=e.target.closest("button"); if (!b) return; e.stopPropagation(); setType(b.dataset.t); closeMenu(); });
  document.addEventListener("click",closeMenu);

  muteBtn.addEventListener("click",()=>{ muted=!muted; muteBtn.textContent=muted?"소리 꺼짐":"소리 켜짐"; muteBtn.classList.toggle("off",muted); if (audioReady) master.gain.setTargetAtTime(muted?0:0.9,AC.currentTime,0.05); });

  window.addEventListener("resize",resize);
  resize();

  // 어떤 첫 제스처에서도 오디오 unlock 보강(모바일)
  const armUnlock=()=>{ initAudio(); unlockAudio(); primeSilent(); };
  window.addEventListener("touchend", armUnlock, {passive:true});
  window.addEventListener("pointerdown", armUnlock, {passive:true});
  window.addEventListener("click", armUnlock);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) unlockAudio(); });

  // 프리렌더 워밍업(캡처 검증용, ?warm=초 [&puff]): 동기로 시뮬 진행 후 1회 렌더
  const q = new URLSearchParams(location.search);
  if (q.has("warm")){
    if (q.has("type") && TYPES[q.get("type")]) setType(q.get("type"));
    if (q.has("weather")) setWeather(q.get("weather"));
    if (!q.has("unlit")){ cig.lit=true; cig.heat=0.42; }   // 검증용: 기본 점화(?unlit=1로 미점화 확인)
    let tt=0; const sec=parseFloat(q.get("warm"))||3;
    for (; tt<sec; tt+=1/60) update(1/60, tt);
    if (q.has("burn")){ cig.drawing=true; const bs=parseFloat(q.get("burn"))||4; for(let e2=0;e2<bs;e2+=1/60){ update(1/60,tt); tt+=1/60; } cig.drawing=false; for(let e3=0;e3<1.5;e3+=1/60){ update(1/60,tt); tt+=1/60; } }
    if (q.has("puff")){ exhale(1200/14); const ex=parseFloat(q.get("puff"))||2.5; for (let e2=0;e2<ex;e2+=1/60){ update(1/60,tt); tt+=1/60; } }
    (function redraw(){ drawBg(); drawAshtray(); drawButts(); drawAshBits(); drawCigScene(); drawSparks(); drawSmoke(); drawRain(); drawSnow(); requestAnimationFrame(redraw); })();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
