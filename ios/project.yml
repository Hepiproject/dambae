name: Dambae
options:
  bundleIdPrefix: com.brandnewlegacy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CTV7Z5BXL8
    SWIFT_VERSION: "5.0"

targets:
  Dambae:
    type: application
    platform: iOS
    sources:
      - path: Dambae
      # 웹 정본은 레포 루트의 index.html 하나다. 복사본을 두면 갈라지므로 직접 번들한다.
      - path: ../index.html
        buildPhase: resources
      # 스토어 스크린샷 촬영용 씬(?warm 프리렌더 훅 유지). DEBUG 에서만 로드한다.
      # Screenshots/build-scene.js 로 생성한다.
      - path: Screenshots/scene.html
        buildPhase: resources
    info:
      path: Dambae/Info.plist
      properties:
        CFBundleDisplayName: 담배 한 대
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandnewlegacy.dambae
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
